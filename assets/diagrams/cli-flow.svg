<g class="component" data-name="Resume saved processing"><rect x="896" y="824" width="320" height="112" rx="6" fill="#f5f5f5"/><rect x="896" y="824" width="320" height="112" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="912" y="848" fill="#2d3142" font-size="12" font-family="'Geist', system-ui, sans-serif" font-weight="600" text-anchor="start" >Resume saved processing</text><text x="912" y="866" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" font-weight="400" text-anchor="start" >R • ainvoke(None)</text><text x="912" y="886" fill="#4f5d75" font-size="11" font-family="'Geist', system-ui, sans-serif" font-weight="400" text-anchor="start" >Pending checkpoint; no added message</text><text x="912" y="906" fill="#4f5d75" font-size="11" font-family="'Geist', system-ui, sans-serif" font-weight="400" text-anchor="start" >Keep completed nodes and saved state</text></g><line x1="40" y1="980" x2="1240" y2="980" stroke="#bfc0c0" stroke-width="0.8"/><text x="40" y="1009" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" font-weight="500" text-anchor="start" letter-spacing="0.14em">KEY</text><line x1="100" y1="1006" x2="128" y2="1006" stroke="#4f5d75" stroke-width="1.2"/><text x="140" y="1009" fill="#4f5d75" font-size="10" font-family="'Geist', system-ui, sans-serif" font-weight="400" text-anchor="start" >Navigation / processing</text><line x1="384" y1="1006" x2="412" y2="1006" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,3"/><text x="424" y="1009" fill="#4f5d75" font-size="10" font-family="'Geist', system-ui, sans-serif" font-weight="400" text-anchor="start" >Return / resume</text><polygon points="670,998 684,1006 670,1014 656,1006" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="696" y="1009" fill="#4f5d75" font-size="10" font-family="'Geist', system-ui, sans-serif" font-weight="400" text-anchor="start" >Diamond: menu choice</text><circle cx="926" cy="1006" r="4" fill="#2d3142"/><text x="952" y="1009" fill="#4f5d75" font-size="10" font-family="'Geist', system-ui, sans-serif" font-weight="400" text-anchor="start" >Return merge</text></svg>
