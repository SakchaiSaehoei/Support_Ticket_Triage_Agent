<path d="M 752,824 V 560 Q 752,552 744,552 H 400" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#cli-flow-cli-flow-arrow)" stroke-dasharray="4,3"/><rect x="760" y="664" width="88" height="12" rx="2" fill="#f5f5f5"/><text x="804.0" y="673" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" font-weight="400" text-anchor="middle" letter-spacing="0.06em">RESULT / ERROR</text>
<path d="M 1176,824 V 528 Q 1176,520 1168,520 H 408 a 8,8 0 0,1 -16,0 H 376 Q 368,520 368,528 V 544 Q 368,552 376,552 H 400" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#cli-flow-cli-flow-arrow)" stroke-dasharray="4,3"/><rect x="720" y="500" width="88" height="12" rx="2" fill="#f5f5f5"/><text x="764.0" y="509" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" font-weight="400" text-anchor="middle" letter-spacing="0.06em">RESULT / ERROR</text>
