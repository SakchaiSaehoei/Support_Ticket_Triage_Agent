<g class="component" data-name="Launch interactive CLI"><rect x="240" y="48" width="320" height="80" rx="20" fill="#f5f5f5"/><rect x="240" y="48" width="320" height="80" rx="20" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="256" y="72" fill="#2d3142" font-size="12" font-family="'Geist', system-ui, sans-serif" font-weight="600" text-anchor="start" >Launch interactive CLI</text><text x="256" y="90" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" font-weight="400" text-anchor="start" >support-triage</text><text x="256" y="110" fill="#4f5d75" font-size="11" font-family="'Geist', system-ui, sans-serif" font-weight="400" text-anchor="start" >TTY check; open SQLite; seed samples</text></g>
<g class="component" data-name="Choose customer"><polygon points="400,184 544,248 400,312 256,248" fill="#f5f5f5"/><polygon points="400,184 544,248 400,312 256,248" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="400.0" y="232.0" fill="#2d3142" font-size="12" font-family="'Geist', system-ui, sans-serif" font-weight="600" text-anchor="middle" >Choose customer</text><text x="400.0" y="252.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" font-weight="400" text-anchor="middle" >NUMBER / N</text><text x="400.0" y="272.0" fill="#4f5d75" font-size="11" font-family="'Geist', system-ui, sans-serif" font-weight="400" text-anchor="middle" >Saved customer list</text></g>
<g class="component" data-name="Small new-customer wizard"><rect x="832" y="184" width="320" height="128" rx="6" fill="#f5f5f5"/><rect x="832" y="184" width="320" height="128" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="848" y="208" fill="#2d3142" font-size="12" font-family="'Geist', system-ui, sans-serif" font-weight="600" text-anchor="start" >Small new-customer wizard</text><text x="848" y="226" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" font-weight="400" text-anchor="start" >Free / Pro / Enterprise</text><text x="848" y="246" fill="#4f5d75" font-size="11" font-family="'Geist', system-ui, sans-serif" font-weight="400" text-anchor="start" >Enter: skip details; 2: optional facts</text><text x="848" y="266" fill="#4f5d75" font-size="11" font-family="'Geist', system-ui, sans-serif" font-weight="400" text-anchor="start" >Save the new customer in SQLite</text><text x="848" y="286" fill="#4f5d75" font-size="11" font-family="'Geist', system-ui, sans-serif" font-weight="400" text-anchor="start" >Skipped facts remain unknown</text></g>
