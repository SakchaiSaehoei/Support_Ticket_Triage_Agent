<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 1040" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cli-flow-title cli-flow-desc" id="cli-flow-root"><title id="cli-flow-title">Interactive CLI flow</title><desc id="cli-flow-desc">CLI flow from saved customer selection or a small customer wizard through ticket history, message persistence, fresh triage and explicit checkpoint resume.</desc><defs>
      <style>#cli-flow-root { --paper: #f5f5f5; --ink: #2d3142; --muted: #4f5d75; --soft: #5a6580; --accent: #bf4520; --rule: #bfc0c0; --link: #2e5aa8; --font-sans: 'Geist', system-ui, sans-serif; --font-mono: 'Geist Mono', ui-monospace, monospace; --font-serif: 'Instrument Serif', serif; }
      #cli-flow-root { color: var(--ink); font-family: var(--font-sans); }
      #cli-flow-root .subtitle { margin:0; max-width:840px; color:var(--muted); font-size:14px; line-height:1.65; }
      #cli-flow-root .diagram-container { width:100%; overflow-x:auto; }
      #cli-flow-root .notes { display:grid; grid-template-columns:1.2fr 1fr; gap:40px; margin:28px 40px 0; border-top:1px solid var(--rule); padding-top:28px; }
      #cli-flow-root .notes h2 { margin:0 0 12px; font-size:14px; font-weight:600; }
      #cli-flow-root .notes p { margin:0 0 14px; font-size:13px; line-height:1.7; color:var(--muted); }
      #cli-flow-root code { font-family:var(--font-mono); font-size:11px; color:var(--ink); }
      #cli-flow-root .flow { font-family:var(--font-mono); font-size:11px; line-height:1.8; color:var(--ink); }
      #cli-flow-root a { color:var(--link); text-underline-offset:4px; }
      #cli-flow-root .notes { grid-template-columns:1fr; gap:16px; margin:20px 12px 0; }
      #cli-flow-root .diagram-container { overflow-x:visible; }
      #cli-flow-root .notes { break-inside:avoid; }</style><marker id="cli-flow-cli-flow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="cli-flow-cli-flow-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker><marker id="cli-flow-cli-flow-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs><rect width="100%" height="100%" fill="#f5f5f5"/><path d="M 400,128 V 184" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#cli-flow-cli-flow-arrow)"/>
<path d="M 544,248 H 832" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#cli-flow-cli-flow-arrow)"/><rect x="676" y="228" width="20" height="12" rx="2" fill="#f5f5f5"/><text x="686.0" y="237" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" font-weight="400" text-anchor="middle" letter-spacing="0.06em">N</text>
<path d="M 400,312 V 360" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#cli-flow-cli-flow-arrow)"/><rect x="408" y="328" width="48" height="12" rx="2" fill="#f5f5f5"/><text x="432.0" y="337" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" font-weight="400" text-anchor="middle" letter-spacing="0.06em">SELECT</text>
<path d="M 992,312 V 416 Q 992,424 984,424 H 544" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#cli-flow-cli-flow-arrow)"/><rect x="720" y="404" width="88" height="12" rx="2" fill="#f5f5f5"/><text x="764.0" y="413" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" font-weight="400" text-anchor="middle" letter-spacing="0.06em">CUSTOMER SAVED</text>
<path d="M 400,488 V 584" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#cli-flow-cli-flow-arrow)"/><rect x="408" y="532" width="56" height="12" rx="2" fill="#f5f5f5"/><text x="436.0" y="541" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" font-weight="400" text-anchor="middle" letter-spacing="0.06em">TICKET #</text>
