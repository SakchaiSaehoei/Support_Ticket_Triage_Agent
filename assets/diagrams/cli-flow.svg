<path d="M 256,648 H 232 Q 224,648 224,656 V 776 Q 224,784 232,784 H 296 Q 304,784 304,792 V 824" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#cli-flow-cli-flow-arrow)"/><rect x="232" y="736" width="40" height="12" rx="2" fill="#f5f5f5"/><text x="252.0" y="745" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" font-weight="400" text-anchor="middle" letter-spacing="0.06em">1 / 2</text>
