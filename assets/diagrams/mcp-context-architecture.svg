<title id="mcp-context-architecture-title">Customer and knowledge context architecture</title><desc id="mcp-context-architecture-desc">Detail of three local MCP tools retrieving customer profiles, knowledge sections through Chroma and OpenAI embeddings, and cached mock system status.</desc><defs>
      <style>#mcp-context-architecture-root { --paper: #f5f5f5; --ink: #2d3142; --muted: #4f5d75; --soft: #5a6580; --accent: #bf4520; --rule: #bfc0c0; --link: #2e5aa8; --font-sans: 'Geist', system-ui, sans-serif; --font-mono: 'Geist Mono', ui-monospace, monospace; --font-serif: 'Instrument Serif', serif; }
      #mcp-context-architecture-root { color: var(--ink); font-family: var(--font-sans); }
      #mcp-context-architecture-root .subtitle { margin:0; max-width:840px; color:var(--muted); font-size:14px; line-height:1.65; }
      #mcp-context-architecture-root .diagram-container { width:100%; overflow-x:auto; }
      #mcp-context-architecture-root .notes { display:grid; grid-template-columns:1.2fr 1fr; gap:40px; margin:28px 40px 0; border-top:1px solid var(--rule); padding-top:28px; }
      #mcp-context-architecture-root .notes h2 { margin:0 0 12px; font-size:14px; font-weight:600; }
      #mcp-context-architecture-root .notes p { margin:0 0 14px; font-size:13px; line-height:1.7; color:var(--muted); }
      #mcp-context-architecture-root code { font-family:var(--font-mono); font-size:11px; color:var(--ink); }
      #mcp-context-architecture-root .flow { font-family:var(--font-mono); font-size:11px; line-height:1.8; color:var(--ink); }
      #mcp-context-architecture-root a { color:var(--link); text-underline-offset:4px; }
      #mcp-context-architecture-root .notes { grid-template-columns:1fr; gap:16px; margin:20px 12px 0; }
      #mcp-context-architecture-root .diagram-container { overflow-x:visible; }
      #mcp-context-architecture-root .notes { break-inside:avoid; }</style><marker id="mcp-context-architecture-mcp-context-architecture-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="mcp-context-architecture-mcp-context-architecture-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker><marker id="mcp-context-architecture-mcp-context-architecture-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs>
