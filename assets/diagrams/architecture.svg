<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 24 640 352" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="assessment-report-title assessment-report-desc" id="assessment-report-root">
        <title id="assessment-report-title">Support triage architecture and data flow</title>
        <desc id="assessment-report-desc">A CLI exchanges messages and results with LangGraph, which accesses support records and separate checkpoints, calls OpenAI models, and uses FastMCP tools for customer profiles and Chroma vector retrieval.</desc>
        <defs>
      <style>#assessment-report-root { --color-paper: #f5f5f5;
      --color-ink: #2d3142;
      --color-muted: #4f5d75;
      --color-soft: #5a6580;
      --color-accent: #bf4520;
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace; }
      #assessment-report-root { color: var(--color-ink); font-family: var(--font-sans); }
      #assessment-report-root .report { width: min(100%, 210mm); margin: 24px auto; padding: 12mm; background: white; }
      #assessment-report-root .subtitle { margin: 8px 0 0; font-size: 12px; color: var(--color-muted); }
      #assessment-report-root .author { margin: 4px 0 0; font-size: 12px; color: var(--color-ink); }
      #assessment-report-root figure { margin: 14px 0 16px; }
      #assessment-report-root .diagram-container { max-width: 640px; margin: 0 auto; }
      #assessment-report-root .diagram-container { width: 100%; overflow-x: auto; }
      #assessment-report-root figcaption { margin-top: 5px; color: var(--color-muted); font-size: 10px; }
      #assessment-report-root .columns { display: grid; grid-template-columns: 1.05fr 1fr; gap: 25px; }
      #assessment-report-root .columns > * { min-width: 0; }
      #assessment-report-root section { break-inside: avoid; margin-top: 14px; }
      #assessment-report-root section:first-child { margin-top: 0; }
      #assessment-report-root .section-number { font-family: var(--font-mono); color: var(--color-accent); font-size: 10px; font-weight: 400; }
      #assessment-report-root .entry { margin: 0 0 4px; font-size: 12.2px; line-height: 1.26; }
      #assessment-report-root .entry strong { font-weight: 600; }
      #assessment-report-root .entry code { font-family: var(--font-mono); font-size: 11.3px; }
      #assessment-report-root .inventory .entry { margin-bottom: 2px; }
      #assessment-report-root .columns { margin-top: 14px; }
      #assessment-report-root .columns section { margin-top: 0; }
      #assessment-report-root .status { font-size: 9px; font-weight: 400; color: var(--color-muted); }
      #assessment-report-root @page { size: A4; margin: 12mm; }
      #assessment-report-root .report { margin: 0; padding: 22px 18px; }
      #assessment-report-root .columns { display: block; }
      #assessment-report-root .columns > div + div { margin-top: 20px; }
      #assessment-report-root .report { width: auto; margin: 0; padding: 0; }
      #assessment-report-root .diagram-container { overflow-x: visible; }
      #assessment-report-root .columns { display: grid; }
      #assessment-report-root .columns > div + div { margin-top: 0; }</style>
          <marker id="assessment-report-assessment-report-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="assessment-report-assessment-report-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>
        <rect x="0" y="24" width="640" height="352" fill="#f5f5f5"/>
        <!-- Connections are drawn before component shapes. Double arrows show
             read/write or a request and its returned data. -->
        <path d="M 152,72 H 216" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#assessment-report-assessment-report-arrow)"/>
        <path d="M 216,104 H 152" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#assessment-report-assessment-report-arrow)"/>
        <path d="M 96,136 V 156 Q 96,164 104,164 H 116 Q 124,164 124,172 V 196" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-start="url(#assessment-report-assessment-report-arrow)" marker-end="url(#assessment-report-assessment-report-arrow)"/>
        <path d="M 280,136 V 164 Q 280,172 272,172 H 240 Q 232,172 232,180 V 236 Q 232,244 224,244 H 208" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-start="url(#assessment-report-assessment-report-arrow)" marker-end="url(#assessment-report-assessment-report-arrow)"/>
        <path d="M 344,136 V 196" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-start="url(#assessment-report-assessment-report-arrow)" marker-end="url(#assessment-report-assessment-report-arrow)"/>
        <path d="M 408,72 H 424 Q 432,72 432,80 V 108 Q 432,116 440,116 H 464" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-start="url(#assessment-report-assessment-report-arrow-link)" marker-end="url(#assessment-report-assessment-report-arrow-link)"/>
        <path d="M 408,104 Q 416,104 416,112 V 152 Q 416,160 424,160 H 480" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-start="url(#assessment-report-assessment-report-arrow)" marker-end="url(#assessment-report-assessment-report-arrow)"/>
        <path d="M 480,176 H 444 Q 436,176 436,184 V 304 Q 436,312 428,312 H 132 Q 124,312 124,304 V 288" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-start="url(#assessment-report-assessment-report-arrow)" marker-end="url(#assessment-report-assessment-report-arrow)"/>
        <path d="M 540,192 V 232" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-start="url(#assessment-report-assessment-report-arrow)" marker-end="url(#assessment-report-assessment-report-arrow)"/>

        <!-- Each connector label has a paper mask and an 8px stroke gap. -->
        <rect x="156" y="52" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="184" y="61" fill="#5a6580" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" text-anchor="middle">MESSAGE</text>
        <rect x="164" y="112" width="40" height="12" rx="2" fill="#f5f5f5"/>
        <text x="184" y="121" fill="#5a6580" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" text-anchor="middle">RESULT</text>
        <rect x="104" y="140" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="140" y="149" fill="#5a6580" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" text-anchor="middle">SAVE / LOAD</text>
        <rect x="192" y="140" width="80" height="12" rx="2" fill="#f5f5f5"/>
        <text x="232" y="149" fill="#5a6580" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" text-anchor="middle">READ / WRITE</text>
        <rect x="288" y="164" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="312" y="173" fill="#5a6580" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" text-anchor="middle">STATE</text>
        <rect x="440" y="80" width="24" height="12" rx="2" fill="#f5f5f5"/>
        <text x="452" y="89" fill="#5a6580" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" text-anchor="middle">LLM</text>
        <rect x="352" y="140" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="380" y="149" fill="#5a6580" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" text-anchor="middle">LOOKUPS</text>
        <rect x="236" y="292" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="264" y="301" fill="#5a6580" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" text-anchor="middle">PROFILE</text>
        <rect x="452" y="208" width="80" height="12" rx="2" fill="#f5f5f5"/>
        <text x="492" y="217" fill="#5a6580" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" text-anchor="middle">QUERY / HITS</text>

        <g data-node="cli">
          <rect x="40" y="40" width="112" height="96" fill="#f5f5f5"/>
          <rect x="40" y="40" width="112" height="96" rx="6" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity=".10"/>
          <line x1="40" y1="72" x2="152" y2="72" stroke="#5a6580" stroke-width=".8"/>
          <!-- Tabler terminal icon (MIT), from Diagram Design's icon library. -->
          <g aria-hidden="true" transform="translate(48,48) scale(.6666667)" fill="none" stroke="#4f5d75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7l5 5l-5 5"/><path d="M12 19l7 0"/></g>
          <text x="72" y="61" fill="#2d3142" font-family="'Geist', system-ui, sans-serif" font-size="12" font-weight="600">Rich CLI</text>
          <text x="52" y="92" fill="#4f5d75" font-family="'Geist', system-ui, sans-serif" font-size="10">Latest message</text>
          <text x="52" y="112" fill="#4f5d75" font-family="'Geist', system-ui, sans-serif" font-size="10">History + results</text>
        </g>
        <g data-node="agent">
          <rect x="216" y="40" width="192" height="96" fill="#f5f5f5"/>
          <rect x="216" y="40" width="192" height="96" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity=".08"/>
          <g aria-hidden="true" fill="#f5f5f5" stroke="#bf4520" stroke-width="1"><path d="M230,56 H242 V64 H230" fill="none"/><circle cx="228" cy="56" r="3"/><circle cx="244" cy="56" r="3"/><circle cx="228" cy="64" r="3"/></g>
          <text x="252" y="63" fill="#2d3142" font-family="'Geist', system-ui, sans-serif" font-size="12" font-weight="600">LangGraph agent</text>
          <text x="228" y="84" fill="#4f5d75" font-family="'Geist', system-ui, sans-serif" font-size="10">History + issue extraction</text>
          <text x="228" y="101" fill="#4f5d75" font-family="'Geist', system-ui, sans-serif" font-size="10">Evidence + guarded decision</text>
          <text x="228" y="118" fill="#4f5d75" font-family="'Geist', system-ui, sans-serif" font-size="10">Draft or mock handoff</text>
        </g>
        <g data-node="models">
          <rect x="464" y="40" width="136" height="96" fill="#f5f5f5"/>
          <path d="M484,136 C472,136 464,128 464,116 C464,104 472,96 484,92 C476,72 496,56 516,60 C524,44 536,40 548,40 C572,40 588,56 588,76 C596,80 600,92 600,104 C600,124 592,136 580,136 Z" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity=".03"/>
          <text x="532" y="94" fill="#2d3142" font-family="'Geist', system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">OpenAI APIs</text>
          <text x="532" y="110" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" text-anchor="middle">Responses / Decisions</text>
          <text x="532" y="124" fill="#4f5d75" font-family="'Geist', system-ui, sans-serif" font-size="10" text-anchor="middle">Extract / classify / draft</text>
        </g>
        <g data-node="records">
          <rect x="40" y="196" width="168" height="92" fill="#f5f5f5"/>
          <path d="M40,208 V276 C40,292 208,292 208,276 V208 Z" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity=".05"/>
          <ellipse cx="124" cy="208" rx="84" ry="12" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1"/>
          <text x="124" y="232" fill="#2d3142" font-family="'Geist', system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Support SQLite</text>
          <text x="124" y="248" fill="#4f5d75" font-family="'Geist', system-ui, sans-serif" font-size="10" text-anchor="middle">Customers + tickets</text>
          <text x="124" y="262" fill="#4f5d75" font-family="'Geist', system-ui, sans-serif" font-size="10" text-anchor="middle">Messages + results</text>
          <text x="124" y="276" fill="#4f5d75" font-family="'Geist', system-ui, sans-serif" font-size="10" text-anchor="middle">Prior ticket analysis</text>
        </g>
        <g data-node="checkpoints">
          <rect x="260" y="196" width="168" height="92" fill="#f5f5f5"/>
          <path d="M260,208 V276 C260,292 428,292 428,276 V208 Z" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity=".05"/>
          <ellipse cx="344" cy="208" rx="84" ry="12" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1"/>
          <g aria-hidden="true" fill="none" stroke="#4f5d75" stroke-width="1"><circle cx="344" cy="208" r="7"/><path d="M344,203 V208 H349"/></g>
          <text x="344" y="232" fill="#2d3142" font-family="'Geist', system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Checkpoint SQLite</text>
          <text x="344" y="248" fill="#4f5d75" font-family="'Geist', system-ui, sans-serif" font-size="10" text-anchor="middle">Saved execution state</text>
          <text x="344" y="262" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" text-anchor="middle">AsyncSqliteSaver</text>
          <text x="344" y="276" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" text-anchor="middle">thread_id = ticket_id</text>
        </g>
        <g data-node="tools">
          <rect x="480" y="144" width="120" height="48" fill="#f5f5f5"/>
          <rect x="480" y="144" width="120" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
