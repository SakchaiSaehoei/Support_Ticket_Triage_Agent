        <text x="176" y="363" fill="#4f5d75" font-family="'Geist', system-ui, sans-serif" font-size="10">Vectors</text>
        <line x1="248" y1="360" x2="268" y2="360" stroke="#4f5d75" stroke-width="1.2"/>
        <text x="276" y="363" fill="#4f5d75" font-family="'Geist', system-ui, sans-serif" font-size="10">Data/tools</text>
        <line x1="368" y1="360" x2="388" y2="360" stroke="#2e5aa8" stroke-width="1.2"/>
        <text x="396" y="363" fill="#4f5d75" font-family="'Geist', system-ui, sans-serif" font-size="10">OpenAI</text>
