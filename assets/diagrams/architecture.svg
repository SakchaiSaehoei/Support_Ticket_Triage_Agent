        </g>
        <g data-node="vectors">
          <rect x="480" y="232" width="120" height="72" fill="#f5f5f5"/>
          <path d="M480,244 V292 C480,308 600,308 600,292 V244 Z" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity=".05"/>
          <ellipse cx="540" cy="244" rx="60" ry="12" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1"/>
