          <g aria-hidden="true" fill="#4f5d75"><circle cx="528" cy="240" r="2"/><circle cx="540" cy="240" r="2"/><circle cx="552" cy="240" r="2"/><circle cx="528" cy="248" r="2"/><circle cx="540" cy="248" r="2"/><circle cx="552" cy="248" r="2"/></g>
          <text x="540" y="268" fill="#2d3142" font-family="'Geist', system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Chroma</text>
          <text x="540" y="283" fill="#4f5d75" font-family="'Geist', system-ui, sans-serif" font-size="10" text-anchor="middle">Vector index</text>
          <text x="540" y="293" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" text-anchor="middle">KB chunks/vectors</text>
        </g>

        <line x1="40" y1="336" x2="600" y2="336" stroke="#bfc0c0" stroke-width=".8"/>
        <g aria-hidden="true" fill="none" stroke="#4f5d75" stroke-width=".8"><path d="M40,352 V364 C40,369 56,369 56,364 V352"/><ellipse cx="48" cy="352" rx="8" ry="3"/></g>
        <text x="64" y="363" fill="#4f5d75" font-family="'Geist', system-ui, sans-serif" font-size="10">SQLite</text>
