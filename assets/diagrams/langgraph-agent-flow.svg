<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1120 1200" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="langgraph-agent-flow-title langgraph-agent-flow-desc" id="langgraph-agent-flow-root"><title id="langgraph-agent-flow-title">LangGraph support triage agent flow</title><desc id="langgraph-agent-flow-desc">All nine LangGraph nodes showing issue extraction before retrieval, guarded decisions, automatic answers, mock handoffs, acknowledgement and persistence, including answer-failure escalation.</desc><defs>
      <style>#langgraph-agent-flow-root { --paper: #f5f5f5; --ink: #2d3142; --muted: #4f5d75; --soft: #5a6580; --accent: #bf4520; --rule: #bfc0c0; --link: #2e5aa8; --font-sans: 'Geist', system-ui, sans-serif; --font-mono: 'Geist Mono', ui-monospace, monospace; --font-serif: 'Instrument Serif', serif; }
      #langgraph-agent-flow-root { color: var(--ink); font-family: var(--font-sans); }
      #langgraph-agent-flow-root .subtitle { margin:0; max-width:840px; color:var(--muted); font-size:14px; line-height:1.65; }
      #langgraph-agent-flow-root .diagram-container { width:100%; overflow-x:auto; }
      #langgraph-agent-flow-root .notes { display:grid; grid-template-columns:1.2fr 1fr; gap:40px; margin:28px 40px 0; border-top:1px solid var(--rule); padding-top:28px; }
      #langgraph-agent-flow-root .notes h2 { margin:0 0 12px; font-size:14px; font-weight:600; }
      #langgraph-agent-flow-root .notes p { margin:0 0 14px; font-size:13px; line-height:1.7; color:var(--muted); }
      #langgraph-agent-flow-root code { font-family:var(--font-mono); font-size:11px; color:var(--ink); }
      #langgraph-agent-flow-root .flow { font-family:var(--font-mono); font-size:11px; line-height:1.8; color:var(--ink); }
      #langgraph-agent-flow-root a { color:var(--link); text-underline-offset:4px; }
      #langgraph-agent-flow-root .notes { grid-template-columns:1fr; gap:16px; margin:20px 12px 0; }
      #langgraph-agent-flow-root .diagram-container { overflow-x:visible; }
      #langgraph-agent-flow-root .notes { break-inside:avoid; }</style><marker id="langgraph-agent-flow-langgraph-agent-flow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="langgraph-agent-flow-langgraph-agent-flow-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker><marker id="langgraph-agent-flow-langgraph-agent-flow-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs><rect width="100%" height="100%" fill="#f5f5f5"/><path d="M 560,56 V 80" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#langgraph-agent-flow-langgraph-agent-flow-arrow)"/>
