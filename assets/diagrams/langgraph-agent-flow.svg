<path d="M 704,576 H 872 Q 880,576 880,584 V 712" fill="none" stroke="#bf4520" stroke-width="1.2" marker-end="url(#langgraph-agent-flow-langgraph-agent-flow-arrow-accent)"/><rect x="744" y="556" width="76" height="12" rx="2" fill="#f5f5f5"/><text x="782.0" y="565" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" font-weight="400" text-anchor="middle" letter-spacing="0.06em">AUTO_RESPOND</text>
