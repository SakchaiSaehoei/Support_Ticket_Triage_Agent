<g class="component" data-name="Retrieve evidence"><rect x="400" y="392" width="320" height="80" rx="6" fill="#f5f5f5"/><rect x="400" y="392" width="320" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="416" y="416" fill="#2d3142" font-size="12" font-family="'Geist', system-ui, sans-serif" font-weight="600" text-anchor="start" >Retrieve evidence</text><text x="416" y="434" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" font-weight="400" text-anchor="start" >retrieve_evidence</text><text x="416" y="454" fill="#4f5d75" font-size="11" font-family="'Geist', system-ui, sans-serif" font-weight="400" text-anchor="start" >Knowledge per issue; status if needed</text></g>
